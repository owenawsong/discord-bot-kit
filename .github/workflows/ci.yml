name: Check workshop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node dist/src/cli.js test --json
      - run: node dist/src/cli.js test --recipe signups --json
      - run: node dist/src/cli.js test --recipe polls --json
      - run: npm pack --dry-run
      - run: node dist/src/cli.js init smoke-bot
      - run: npm install
        working-directory: smoke-bot
      - run: npm test
        working-directory: smoke-bot
      - run: node dist/src/cli.js init smoke-signups --recipe signups
      - run: npm install
        working-directory: smoke-signups
      - run: npm test
        working-directory: smoke-signups
      - run: node dist/src/cli.js init smoke-polls --recipe polls
      - run: npm install
        working-directory: smoke-polls
      - run: npm test
        working-directory: smoke-polls
      - run: npm run doctor -- --local
        working-directory: smoke-polls
