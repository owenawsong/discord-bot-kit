<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="326" viewBox="0 0 1000 326" role="img" aria-labelledby="title desc"><title id="title">Local ticket workflow from actual Discord Bot Kit handlers</title><desc id="desc">Mira creates a ticket. Rowan is denied closure and its state remains open. Alex closes it as moderator. This is a trace illustration, not a Discord screenshot.</desc><rect width="1000" height="326" rx="12" fill="#161922"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="36" fill="#f1f2f8" font-size="19" font-weight="700">A button click is a new authorization check.</text><text x="28" y="62" fill="#aeb7cb" font-size="12">Local ticket workflow · generated from shared handlers</text><g transform="translate(28,90)"><rect width="300" height="185" rx="9" fill="#20232e" stroke="#383d4e"/><text x="18" y="30" fill="#9fd6bf" font-size="13" font-weight="700">1 / Mira</text><text x="18" y="61" fill="#f1f2f8" font-size="14">Open a support ticket</text><text x="18" y="91" fill="#aeb7cb" font-family="monospace" font-size="11">ticket:create</text><path d="M18 111H282" stroke="#383d4e"/><text x="18" y="137" fill="#9fd6bf" font-family="monospace" font-size="11">Acknowledged</text><text x="18" y="164" fill="#f1f2f8" font-size="12">ticket state: open</text></g><g transform="translate(346,90)"><rect width="300" height="185" rx="9" fill="#20232e" stroke="#383d4e"/><text x="18" y="30" fill="#f4b2a4" font-size="13" font-weight="700">2 / Rowan</text><text x="18" y="61" fill="#f1f2f8" font-size="14">Try closing someone else’s ticket</text><text x="18" y="91" fill="#aeb7cb" font-family="monospace" font-size="11">ticket:close:ticket-1</text><path d="M18 111H282" stroke="#383d4e"/><text x="18" y="137" fill="#f4b2a4" font-family="monospace" font-size="11">GW_PERMISSION_DENIED</text><text x="18" y="164" fill="#f1f2f8" font-size="12">ticket state: open</text></g><g transform="translate(664,90)"><rect width="300" height="185" rx="9" fill="#20232e" stroke="#383d4e"/><text x="18" y="30" fill="#b9a9ff" font-size="13" font-weight="700">3 / Alex</text><text x="18" y="61" fill="#f1f2f8" font-size="14">Close as the moderator</text><text x="18" y="91" fill="#aeb7cb" font-family="monospace" font-size="11">ticket:close:ticket-1</text><path d="M18 111H282" stroke="#383d4e"/><text x="18" y="137" fill="#b9a9ff" font-family="monospace" font-size="11">Acknowledged</text><text x="18" y="164" fill="#f1f2f8" font-size="12">ticket state: closed</text></g><text x="28" y="306" fill="#aeb7cb" font-size="11">Assert the response and resulting state. Preserve the workflow as an executable scenario.</text></g></svg>
